name: Credential Store Tests

on:
  push:
    branches:
      - security/harden-auth
  pull_request:

jobs:
  credential-store:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring

      - name: Run credential store tests
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew test

      - name: Run credential store tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -c '
            eval "$(gnome-keyring-daemon --start --components=secrets)"

            set +e

            ./gradlew test --stacktrace --info
            TEST_EXIT=$?

            echo ""
            echo "===== JUnit test results ====="

            if ls build/test-results/test/*.xml >/dev/null 2>&1; then
              cat build/test-results/test/*.xml
            else
              echo "No JUnit XML results found."
            fi

            exit $TEST_EXIT
          '

      - name: Upload Linux test report
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-credential-store-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/